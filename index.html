        sP.appendChild(block);
      }
      main.appendChild(sP);
    }
  }

  // ---- Habilidades ----
  var SKILLS = [
    {n:'Acrobacias', a:'des'}, {n:'Arcanos', a:'int'}, {n:'Artesanía', a:'int'}, {n:'Atletismo', a:'fue'},
    {n:'Diplomacia', a:'car'}, {n:'Engaño', a:'car'}, {n:'Interpretación', a:'car'}, {n:'Intimidación', a:'car'},
    {n:'Latrocinio', a:'des'}, {n:'Medicina', a:'sab'}, {n:'Naturaleza', a:'sab'}, {n:'Ocultismo', a:'int'},
    {n:'Religión', a:'sab'}, {n:'Sigilo', a:'des'}, {n:'Sociedad', a:'int'}, {n:'Supervivencia', a:'sab'}
  ];
  var SKILL_ATTR = {}; SKILLS.forEach(function(s){ SKILL_ATTR[s.n] = s.a; });
  function isLore(n){ return /^Saber \(.+\)$/.test(n || ''); }
  function skillAttr(n){ return SKILL_ATTR[n] || (isLore(n) ? 'int' : null); }
  function isSkillName(n){ return !!SKILL_ATTR[n] || isLore(n); }

  function habState(){
    if(!ficha.habilidades) ficha.habilidades = {};
    var h = ficha.habilidades;
    ['claseElegidas','subclase','trasfondoManual','libres','intExtra'].forEach(function(k){ if(!Array.isArray(h[k])) h[k] = []; });
    if(!h.incrementos || typeof h.incrementos !== 'object') h.incrementos = {};
    return h;
  }
  function bgSkillInfo(t){
    var fixed = [], notes = [];
    (t ? t.habilidades : []).forEach(function(x){ if(isSkillName(x)) fixed.push(x); else notes.push(x); });
    var manual = 0;
    if(t && !t.habilidades.length){ manual = 2; notes.push('Este trasfondo describe sus habilidades en el texto: elígelas a mano.'); }
    else if(notes.length) manual = notes.length;
    return {fixed: fixed, notes: notes, manual: manual};
  }
  function intModAtLevel1(){
    var keep = ficha.nivel; ficha.nivel = 1;
    var m = computeAttrs().mod.int;
    ficha.nivel = keep;
    return m;
  }
  // Calcula las habilidades entrenadas y los rangos, y cuántas elecciones corresponden a cada fuente
  function computeSkills(){
    var c = fClase(), t = fTrasfondo(), h = habState();
    var ranks = {}, sources = {};
    function train(n, src){ if(!n) return false; if(ranks[n]) return false; ranks[n] = 1; sources[n] = src; return true; }
    var overlaps = 0;
    var bg = bgSkillInfo(t);
    bg.fixed.forEach(function(n){ train(n, 'Trasfondo'); });
    h.trasfondoManual.slice(0, bg.manual).forEach(function(n){ train(n, 'Trasfondo'); });
    if(c){
      c.hab.fijas.forEach(function(n){ if(!train(n, 'Clase')) overlaps++; });
      c.hab.elegir.forEach(function(g, i){ var n = h.claseElegidas[i]; if(n && !train(n, 'Clase')) overlaps++; });
      h.subclase.slice(0, c.hab.subclase).forEach(function(n){ if(!train(n, 'Subclase')) overlaps++; });
    }
    var intM = intModAtLevel1();
    var libresN = c ? Math.max(0, c.hab.extra + intM) + overlaps : 0;
    h.libres.slice(0, libresN).forEach(function(n){ train(n, 'Libre'); });
    var intNow = computeAttrs().mod.int;
    var intExtraN = Math.max(0, intNow - intM);
    h.intExtra.slice(0, intExtraN).forEach(function(n){ train(n, 'Inteligencia'); });
    // incrementos por nivel, en orden
    var incLevels = c ? c.huecos.incHabilidad.filter(function(l){ return l <= ficha.nivel; }) : [];
    incLevels.forEach(function(l){
      var n = h.incrementos[l];
      if(n && ranks[n] && canIncrease(ranks[n], l)) ranks[n]++;
    });
    return {ranks: ranks, sources: sources, libresN: libresN, intExtraN: intExtraN, overlaps: overlaps, incLevels: incLevels, bg: bg};
  }
  function canIncrease(rank, level){
    if(rank >= 4) return false;
    if(rank === 2 && level < 7) return false;   // a maestro desde nivel 7
    if(rank === 3 && level < 15) return false;  // a legendario desde nivel 15
    return true;
  }
  // Rangos antes de aplicar el incremento del nivel indicado (para ofrecer opciones válidas)
  function ranksBeforeLevel(level){
    var c = fClase(), h = habState();
    var sk = computeSkills();
    var ranks = {};
    Object.keys(sk.sources).forEach(function(n){ ranks[n] = 1; });
    sk.incLevels.forEach(function(l){
      if(l >= level) return;
      var n = h.incrementos[l];
      if(n && ranks[n] && canIncrease(ranks[n], l)) ranks[n]++;
    });
    return ranks;
  }
  function skillOptions(exclude, allowLoreInput){
    var opts = SKILLS.filter(function(s){ return exclude.indexOf(s.n) === -1; }).map(function(s){ return {value:s.n, label:s.n}; });
    if(allowLoreInput) opts.push({value:'__lore__', label:'Saber (otro)…'});
    return opts;
  }
  function loreAwareSelect(current, exclude, placeholder, onSet){
    var opts = skillOptions(exclude, true);
    if(current && isLore(current)) opts.splice(opts.length-1, 0, {value: current, label: current});
    return makeSelect(opts, current, placeholder, function(v){
      if(v === '__lore__'){
        var name = prompt('¿Qué Saber? (por ejemplo: guerra, Absalom, ingeniería)');
        if(!name || !name.trim()){ render(); return; }
        v = 'Saber (' + name.trim() + ')';
      }
      onSet(v);
    });
  }

  function renderSkillsSection(main){
    var c = fClase(), t = fTrasfondo();
    var sH = section('Habilidades');
    if(!c || !t){
      sH.appendChild(el('div','ficha-note','Elige trasfondo y clase para repartir las habilidades.'));
      main.appendChild(sH); return;
    }
    var h = habState();
    var sk = computeSkills();
    var trained = Object.keys(sk.ranks);

    function pickRow(label, current, onSet, note){
      var row = el('div','ficha-slot');
      row.appendChild(el('span','ficha-slot-l', escapeHtml(label)));
      var exclude = trained.filter(function(n){ return n !== current; });
      row.appendChild(loreAwareSelect(current || null, exclude, '— sin elegir —', function(v){ change(function(){ onSet(v); }); }));
      sH.appendChild(row);
      if(note) sH.appendChild(el('div','ficha-note', escapeHtml(note)));
    }
    function setAt(arr, i, v){ while(arr.length < i) arr.push(null); arr[i] = v; }

    // Automáticas
    var auto = [];
    sk.bg.fixed.forEach(function(n){ auto.push(n + ' (trasfondo)'); });
    c.hab.fijas.forEach(function(n){ auto.push(n + ' (clase)'); });
    sH.appendChild(el('div','ficha-level-f', auto.length ? 'Entrenado automáticamente en: ' + escapeHtml(auto.join(', ')) : ''));
    sk.bg.notes.forEach(function(nt){ sH.appendChild(el('div','ficha-note', 'Trasfondo: ' + escapeHtml(nt))); });
    for(var i = 0; i < sk.bg.manual; i++) (function(i){ pickRow('Del trasfondo', h.trasfondoManual[i], function(v){ setAt(h.trasfondoManual, i, v); }); })(i);

    c.hab.elegir.forEach(function(g, i){
      var row = el('div','ficha-slot');
      row.appendChild(el('span','ficha-slot-l','De la clase'));
      row.appendChild(makeSelect(g.map(function(n){ return {value:n, label:n}; }), h.claseElegidas[i] || null, 'Elige: ' + g.join(' o '), function(v){ change(function(){ setAt(h.claseElegidas, i, v); }); }));
      sH.appendChild(row);
    });
    for(var j = 0; j < c.hab.subclase; j++) (function(j){
      pickRow('De la subclase', h.subclase[j], function(v){ setAt(h.subclase, j, v); }, j === 0 ? 'Habilidad ' + c.hab.notaSubclase + ' (mira el texto de tu elección de clase).' : '');
    })(j);

    sH.appendChild(el('div','ficha-boost-label', 'Habilidades adicionales <em>(' + Math.min(h.libres.filter(Boolean).length, sk.libresN) + '/' + sk.libresN + ')</em>'));
    sH.appendChild(el('div','ficha-note', c.hab.extra + ' de la clase + modificador de Inteligencia a nivel 1' + (sk.overlaps ? ' + ' + sk.overlaps + ' por habilidades repetidas' : '') + '.'));
    for(var k = 0; k < sk.libresN; k++) (function(k){ pickRow('Adicional ' + (k+1), h.libres[k], function(v){ setAt(h.libres, k, v); }); })(k);
    if(sk.intExtraN){
      sH.appendChild(el('div','ficha-note', 'Tu Inteligencia ha subido desde el nivel 1: ganas ' + sk.intExtraN + ' habilidad(es) entrenada(s) más.'));
      for(var q = 0; q < sk.intExtraN; q++) (function(q){ pickRow('Por Inteligencia ' + (q+1), h.intExtra[q], function(v){ setAt(h.intExtra, q, v); }); })(q);
    }

    // Tabla
    var at = computeAttrs().mod;
    var names = SKILLS.map(function(s){ return s.n; }).concat(trained.filter(isLore).sort());
    var table = el('div','ficha-skills');
    names.forEach(function(n){
      var r = sk.ranks[n] || 0;
      var v = at[skillAttr(n)] + profBonus(r) + skillArmorPenalty(n, armorInfo(at));
      var row = el('div','ficha-skill' + (r ? ' trained' : ''));
      row.innerHTML = '<span class="ficha-skill-n">' + escapeHtml(n) + ' <small>' + ATR_NAME[skillAttr(n)].slice(0,3).toUpperCase() + '</small></span>' +
                      '<span class="ficha-skill-r">' + PROF_LABEL[r] + '</span><span class="ficha-skill-v">' + fmtMod(v) + '</span>';
      table.appendChild(row);
    });
    sH.appendChild(table);
    main.appendChild(sH);
  }

  // Selector de incremento de habilidad dentro del bloque de un nivel
  function skillIncreaseRow(level){
    var h = habState();
    var before = ranksBeforeLevel(level);
    var cur = h.incrementos[level] || null;
    var opts = Object.keys(before).filter(function(n){ return canIncrease(before[n], level); }).sort(function(a,b){ return a.localeCompare(b,'es'); })
      .map(function(n){ return {value:n, label:n + ' (' + PROF_LABEL[before[n]].toLowerCase() + ' → ' + PROF_LABEL[before[n]+1].toLowerCase() + ')'}; });
    var row = el('div','ficha-slot');
    row.appendChild(el('span','ficha-slot-l','Incremento de habilidad'));
    row.appendChild(makeSelect(opts, cur, '— sin elegir —', function(v){ change(function(){ if(v) h.incrementos[level] = v; else delete h.incrementos[level]; }); }));
    if(cur && !opts.some(function(o){ return o.value === cur; })) row.appendChild(el('span','ficha-note','«' + escapeHtml(cur) + '» ya no es válido aquí.'));
    return row;
  }

  // ---- Equipo ----
  var EQ_CAT_LABEL = {simple:'sencilla', marcial:'marcial', avanzada:'avanzada', sinArmas:'sin armas',
                      sinArmadura:'sin armadura', ligera:'ligera', intermedia:'intermedia', pesada:'pesada'};
  var DMG_LABEL = {C:'contundente', P:'perforante', S:'cortante', F:'fuego'};
  function eqState(){
    if(!ficha.equipo || typeof ficha.equipo !== 'object') ficha.equipo = {};
    var e = ficha.equipo;
    if(e.armadura === undefined) e.armadura = null;
    if(!e.armaduraPotencia) e.armaduraPotencia = 0;
    if(!e.resistencia) e.resistencia = 0;
    if(e.escudo === undefined) e.escudo = null;
    if(!Array.isArray(e.armas)) e.armas = [];
    return e;
  }
  function eqData(){ return (BASE && BASE.equipo) || {armaduras:[], escudos:[], armas:[]}; }
  function eqRank(k){
    var c = fClase(); if(!c || !c.competenciasEquipo) return 0;
    var r = c.competenciasEquipo.inicial[k] || 0;
    c.competenciasEquipo.mejoras.forEach(function(m){ if(m.k === k && m.nivel <= ficha.nivel && m.rango > r) r = m.rango; });
    return r;
  }
  function curArmor(){ var e = eqState(); return e.armadura ? findBy(eqData().armaduras, 'id', e.armadura) : null; }
  function curShield(){ var e = eqState(); return e.escudo ? findBy(eqData().escudos, 'id', e.escudo) : null; }
  function armorInfo(mod){
    var e = eqState(), ar = curArmor();
    var cat = ar ? ar.categoria : 'sinArmadura';
    var rank = eqRank(cat);
    var dexCap = (ar && ar.destrezaMax !== null && ar.destrezaMax !== undefined) ? ar.destrezaMax : 99;
    var dex = Math.min(mod.des, dexCap);
    var pot = ar ? (e.armaduraPotencia || 0) : 0;
    var ac = 10 + dex + profBonus(rank) + (ar ? ar.ca : 0) + pot;
    var meets = !ar || !ar.fuerza || mod.fue >= ar.fuerza;
    var checkPen = (ar && !meets) ? (ar.penalizador || 0) : 0;
    var speedPen = ar ? (ar.velocidad || 0) : 0;
    if(ar && meets && speedPen) speedPen = Math.min(0, speedPen + 5);
    var flexible = ar && (ar.rasgosEn || []).indexOf('flexible') !== -1;
    return {ac: ac, rank: rank, cat: cat, armor: ar, dexCap: dexCap, meets: meets, checkPen: checkPen, speedPen: speedPen, flexible: flexible, pot: pot};
  }
  function skillArmorPenalty(skillName, info){
    if(!info.checkPen) return 0;
    var a = skillAttr(skillName);
    if(a !== 'fue' && a !== 'des') return 0;
    if(info.flexible && (skillName === 'Acrobacias' || skillName === 'Atletismo')) return 0;
    return info.checkPen;
  }
  function weaponCalc(w, slot, mod){
    var c = fClase();
    var rank = eqRank(w.categoria);
    var tr = w.rasgosEn || [];
    var ranged = w.tipo === 'distancia';
    var attr = ranged ? mod.des : (tr.indexOf('finesse') !== -1 ? Math.max(mod.fue, mod.des) : mod.fue);
    var pot = slot.potencia || 0;
    var atk = attr + profBonus(rank) + pot;
    var agile = tr.indexOf('agile') !== -1;
    var dice = 1 + (slot.golpe || 0);
    var die = (w.dado || '1d4').replace(/^\d+/, '');
    var bonus = 0;
    if(!ranged || tr.indexOf('thrown') !== -1) bonus += mod.fue;
    else if(tr.indexOf('propulsive') !== -1) bonus += mod.fue > 0 ? Math.floor(mod.fue/2) : mod.fue;
    var esp = c && c.especializacion ? c.especializacion : {};
    if(rank >= 2 && esp.normal && ficha.nivel >= esp.normal){
      var sb = rank; // experto 2, maestro 3, legendario 4
      if(esp.mayor && ficha.nivel >= esp.mayor) sb *= 2;
      bonus += sb;
    }
    var dmg = dice + die + (bonus ? (bonus > 0 ? ' + ' + bonus : ' − ' + Math.abs(bonus)) : '');
    return {atk: atk, map: agile ? [4,8] : [5,10], dmg: dmg, rank: rank};
  }

  function renderEquipoSection(main){
    var c = fClase();
    var sE = section('Equipo');
    if(!BASE || !BASE.equipo){ sE.appendChild(el('div','ficha-note','Falta la sección de equipo en base.json.')); main.appendChild(sE); return; }
    var e = eqState(), D = eqData();
    var mod = computeAttrs().mod;
    function rar(x){ return rarLabel(x.rareza); }
    function row(label, control){ var r = el('div','ficha-slot'); r.appendChild(el('span','ficha-slot-l', escapeHtml(label))); r.appendChild(control); sE.appendChild(r); return r; }
    function numSelect(val, max, fmt, onSet){
      return makeSelect(Array.from({length:max}, function(_,i){ return {value:String(i+1), label:fmt(i+1)}; }), val ? String(val) : null, fmt(0), function(v){ change(function(){ onSet(parseInt(v || '0', 10)); }); });
    }
    // Armadura
    var groups = ['sinArmadura','ligera','intermedia','pesada'].map(function(cat){
      return {group: 'Armadura ' + EQ_CAT_LABEL[cat] + ' (' + PROF_LABEL[eqRank(cat)].toLowerCase() + ')',
              items: D.armaduras.filter(function(a){ return a.categoria === cat; }).map(function(a){ return {value:a.id, label:a.nombre + ' — CA +' + a.ca + rar(a)}; })};
    });
    row('Armadura', makeSelect(groups, e.armadura, 'Sin armadura', function(v){ change(function(){ e.armadura = v; }); }));
    var info = armorInfo(mod);
    if(info.armor){
      var ar = info.armor;
      sE.appendChild(detailBox('<dl class="ficha-dl"><dt>Categoría</dt><dd>' + EQ_CAT_LABEL[ar.categoria] + ' · ' + PROF_LABEL[info.rank].toLowerCase() + '</dd>' +
        '<dt>CA</dt><dd>+' + ar.ca + (ar.destrezaMax !== null ? ' · Destreza máx. +' + ar.destrezaMax : '') + '</dd>' +
        (ar.fuerza ? '<dt>Fuerza</dt><dd>' + fmtMod(ar.fuerza) + (info.meets ? ' (la cumples)' : ' (no la cumples)') + '</dd>' : '') +
        (ar.penalizador ? '<dt>Penalizador</dt><dd>' + ar.penalizador + ' a pruebas' + (info.meets ? ' (no se aplica: cumples la Fuerza)' : '') + '</dd>' : '') +
        (ar.velocidad ? '<dt>Velocidad</dt><dd>' + ar.velocidad + ' pies' + (info.meets ? ' (' + info.speedPen + ' al cumplir la Fuerza)' : '') + '</dd>' : '') +
        (ar.rasgos.length ? '<dt>Rasgos</dt><dd>' + escapeHtml(ar.rasgos.join(', ')) + '</dd>' : '') + '</dl>' +
        (info.rank === 0 ? '<p class="ficha-note">No estás entrenado en esta armadura: no sumas competencia a la CA.</p>' : '')));
      row('Runa de potencia', numSelect(e.armaduraPotencia, 3, function(n){ return n ? '+' + n + ' a la CA' : 'Sin runa'; }, function(n){ e.armaduraPotencia = n; }));
      row('Runa de resistencia', numSelect(e.resistencia, 3, function(n){ return n ? ['','Resistente','Resistente mayor','Resistente superior'][n] + ' (+' + n + ' salvaciones)' : 'Sin runa'; }, function(n){ e.resistencia = n; }));
    }
    // Escudo
    row('Escudo', makeSelect(D.escudos.map(function(s){ return {value:s.id, label:s.nombre + ' — CA +' + s.ca + ', dureza ' + s.dureza + rar(s)}; }), e.escudo, 'Sin escudo', function(v){ change(function(){ e.escudo = v; }); }));
    // Armas

  function casterInfo(){

    var trad = (ficha.tradicion && c.tradicion.indexOf(ficha.tradicion) !== -1) ? ficha.tradicion : (c.tradicion.length === 1 ? c.tradicion[0] : null);
    var slots = c.lanzamiento.espacios[String(ficha.nivel)] || {};
    var espontaneo = c.lanzamiento.tipo === 'espontaneo';
    var ranks = Object.keys(slots).map(Number).sort(function(a,b){ return a-b; });
    return {clase: c, trad: trad, key: trad ? TRAD_KEY[trad] : null, slots: slots, ranks: ranks,
            tipo: c.lanzamiento.tipo, espontaneo: espontaneo,
            marca: espontaneo ? 'aprendidos' : 'preparados', maxRank: ranks.length ? ranks[ranks.length-1] : 0};
  }
  // Conjuros marcados (✓ preparados o ✦ aprendidos según el tipo de lanzador) de la tradición, por rango
  function markedSpellsByRank(ci){
    var marks = ci.espontaneo ? known : prepared;
    var by = {}, fuera = 0;
    SPELLS.forEach(function(sp){
      if(!marks[sp.id]) return;
      if(sp.school !== ci.key){ fuera++; return; }
      (by[sp.rank] = by[sp.rank] || []).push(sp);
    });
    Object.keys(by).forEach(function(r){ by[r].sort(function(a,b){ return a.name.localeCompare(b.name,'es'); }); });

  // ---- Conjuros de foco ----
  function normKey(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, ''); }
  var FOCUS_ALIASES = {Magus:['magus','magoespada','magodeespada','magodebatalla'], Witch:['bruja','brujo'], Kineticist:['cineticista','cinetista','kineticista'],
                       Summoner:['invocador'], Exemplar:['ejemplar'], Runesmith:['herrerorunico']};
  function focusClassFor(c){
    if(!c) return null;
    var cands = [normKey(c.nombre)].concat(FOCUS_ALIASES[c.id] || []);
    return CLASSES.filter(function(k){ return cands.indexOf(normKey(k.label)) !== -1 || cands.indexOf(normKey(k.key)) !== -1; })[0] || null;
  }
  function isFocusCantrip(sp){
    if(/truco|cantrip/i.test(sp.rankLabel || '')) return true;
    return (sp.traits || []).some(function(t){ return /^(truco|cantrip)$/i.test(t); });
  }
  // Atributo con el que se lanzan los conjuros de foco (si no es el atributo clave)
  var FOCUS_ATTR = {Champion:'car', Monk:'sab', Ranger:'sab', Magus:'int'};
  function castAttr(c){ return c ? ({Magus:'int'}[c.id] || null) : null; }
  function focusInfo(){
    var c = fClase();

    var spells = mine.filter(function(sp){ return !isFocusCantrip(sp); });
    var cantrips = mine.filter(isFocusCantrip);
    var puntos = Math.min(3, spells.length);
    var fc = focusClassFor(c);
    var hasClassFocus = fc ? FOCUS_SPELLS.some(function(sp){ return sp.classKey === fc.key; }) : false;
    return {clase: c, fc: fc, hasClassFocus: hasClassFocus, spells: spells, cantrips: cantrips, puntos: puntos,

  function focusCasterBanner(main, classDef){

  // ---- Dotes y conjuros que concede la clase / subclase ----
  function normName(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’'`´]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  function tokenSim(a, b){
    var A = a.split(' ').filter(Boolean), B = b.split(' ').filter(Boolean);
    if(!A.length || !B.length) return 0;
    var inter = A.filter(function(x){ return B.indexOf(x) !== -1; }).length;
    return inter / Math.max(A.length, B.length);
  }
  // Busca un conjuro por su nombre en español (o inglés si la lista lo tiene)
  function matchSpell(list, g){
    var link = ficha.vinculos && ficha.vinculos[g.en];
    if(link){ var l = list.filter(function(sp){ return String(sp.id) === String(link); })[0]; if(l) return l; }
    var es = normName(g.nombre), en = normName(g.en);
    var best = null, bestS = 0;
    for(var i = 0; i < list.length; i++){
      var sp = list[i];
      if(sp.game === 'sf' || sp.source === 'Starfinder') continue;
      var n = normName(sp.name);
      if(n === es || n === en || normName(sp.en || sp.name_en || sp.nameEn || '') === en) return sp;
      var s = Math.max(tokenSim(n, es), tokenSim(n, en));
      if(s > bestS){ bestS = s; best = sp; }
    }
    return bestS >= 0.75 ? best : null;
  }
  function matchFeat(g, preferSkill){
    var es = normName(g.buscar || g.nombre);
    var c = FEATS.filter(function(f){ return f.game !== 'sf' && normName(f.name) === es; });
    var cl = fClase();
    if(preferSkill) return c.filter(function(f){ return f.group === 'skill'; })[0] || c[0] || null;
    return c.filter(function(f){ return cl && f.category === cl.categoriaDotes; })[0] || c.filter(function(f){ return f.group === 'skill'; })[0] || c[0] || null;
  }
  // Lista de lo concedido, con su origen y si se ha encontrado en los datos
  function bgFeatGrants(){
    var t = fTrasfondo(), out = [];
    if(!t) return out;
    var sel = ficha.dotesTrasfondo || {};
    (t.dotesConcede || []).forEach(function(slot, i){
      var o = slot.length === 1 ? slot[0] : findBy(slot, 'en', sel[i]);
      if(o) out.push({g: {tipo:'dote', en:o.en, nombre:o.nombre, buscar:o.buscar, nivel:1}, origen: 'Trasfondo ' + t.nombre, bg: true});
    });
    return out;
  }
  function activeGrants(){
    var c = fClase();
    var out = bgFeatGrants();
    if(c) (c.concede || []).forEach(function(g){ out.push({g: g, origen: c.nombre}); });
    if(c) (c.subclases || []).forEach(function(sub){
      (ficha.subclases[sub.tipo] || []).forEach(function(en){
        var o = findBy(sub.opciones, 'en', en);
        if(o) (o.concede || []).forEach(function(g){ out.push({g: g, origen: sub.etiqueta + ' ' + o.nombre}); });
      });
    });
    var ci = casterInfo();
    return out.filter(function(x){
      if((x.g.nivel || 1) > ficha.nivel) return false;
      if(x.g.tipo === 'conjuro' && ci && x.g.rango > ci.maxRank) return false;
      return true;
    }).map(function(x){
      var item = null;
      if(x.g.tipo === 'dote') item = matchFeat(x.g, x.bg);
      else if(x.g.tipo === 'foco') item = matchSpell(FOCUS_SPELLS, x.g);
      else item = matchSpell(SPELLS.filter(function(sp){ return !ci || !ci.key || sp.school === ci.key; }), x.g) || matchSpell(SPELLS, x.g);
      return {g: x.g, origen: x.origen, item: item};
    });
  }
  // Marca automáticamente lo concedido (✓ dotes elegidas, ✦ conjuros) y desmarca lo que ya no toca
  function syncGrants(){
    if(!BASE || !FEATS.length) return;
    if(!ficha.auto) ficha.auto = {dotes:[], conjuros:[]};
    var now = {dotes:[], conjuros:[]};
    activeGrants().forEach(function(x){
      if(!x.item) return;
      if(x.g.tipo === 'dote') now.dotes.push(String(x.item.id)); else now.conjuros.push(String(x.item.id));
    });
    var changedF = false, changedK = false;
    ficha.auto.dotes.forEach(function(id){ if(now.dotes.indexOf(id) === -1 && chosenFeats[id]){ delete chosenFeats[id]; changedF = true; } });
    ficha.auto.conjuros.forEach(function(id){ if(now.conjuros.indexOf(id) === -1 && known[id]){ delete known[id]; changedK = true; } });
    now.dotes.forEach(function(id){ if(!chosenFeats[id]){ chosenFeats[id] = true; changedF = true; } });
    now.conjuros.forEach(function(id){ if(!known[id]){ known[id] = true; changedK = true; } });
    ficha.auto = now;
    if(changedF) saveChosenFeats(chosenFeats);
    if(changedK){ saveKnown(known); updateKnownCount(); }
    saveFicha();
  }
  function isAutoFeat(id){ return !!(ficha.auto && ficha.auto.dotes.indexOf(String(id)) !== -1); }

  // ---- Hoja imprimible ----
  function buildPrintSheet(){
    var a = fAsc(), h = fHerencia(), t = fTrasfondo(), c = fClase();
    var E = escapeHtml;
    var at = computeAttrs(), m = at.mod;
    var clave = c ? (claveOptions(c).length === 1 ? claveOptions(c)[0] : ficha.mejoras.clase) : null;
    var claveMod = clave ? m[clave] : 0;
    var ai = armorInfo(m), sh = curShield(), eq = eqState();
    var res = curArmor() ? (eq.resistencia || 0) : 0;
    function st(stat, modKey, base, item){
      var r = rankAt(c, stat);
      var v = (base || 0) + profBonus(r) + (modKey ? m[modKey] : claveMod) + (item || 0);
      return {v: v, r: r};
    }
    function box(label, value, sub){
      return '<div class="ps-box"><div class="ps-box-v">' + value + '</div><div class="ps-box-l">' + E(label) + '</div>' + (sub ? '<div class="ps-box-s">' + sub + '</div>' : '') + '</div>';
    }
    function sec(title, inner){ return '<section class="ps-sec"><h3>' + E(title) + '</h3>' + inner + '</section>'; }
    var html = '';

    // Cabecera
    var sub = [c ? c.nombre + ' ' + ficha.nivel : 'Sin clase',
               a ? a.nombre : '', h ? h.nombre : '', t ? 'Trasfondo: ' + t.nombre : ''].filter(Boolean).join(' · ');
    var subcl = [];
    if(c) c.subclases.forEach(function(sb){
      var ch = (ficha.subclases[sb.tipo] || []).map(function(en){ var o = findBy(sb.opciones,'en',en); return o ? o.nombre : en; });
      if(ch.length) subcl.push(sb.etiqueta + ': ' + ch.join(', '));
    });
    var ci0 = casterInfo();
    if(ci0 && ci0.trad && c.tradicion.length > 1) subcl.push('Tradición: ' + ci0.trad);
    html += '<header class="ps-head"><div><div class="ps-name">' + E(activeCharacter) + '</div><div class="ps-sub">' + E(sub) + '</div>' +
            (subcl.length ? '<div class="ps-sub2">' + E(subcl.join(' · ')) + '</div>' : '') + '</div>' +
            '<div class="ps-meta">' + (a ? E(a.tamano.join('/')) + ' · ' + (a.velocidad + ai.speedPen) + ' pies' + (a.vision ? ' · ' + E(a.vision) : '') : '') +
            (a ? '<br>' + E(a.idiomas.join(', ')) : '') + (a ? '<br><i>' + E(a.rasgos.join(', ')) + '</i>' : '') + '</div></header>';

    // Atributos
    html += '<div class="ps-attrs">' + ATRS.map(function(x){
      return '<div class="ps-attr"><div class="ps-attr-c">' + x.c + '</div><div class="ps-attr-v">' + fmtMod(m[x.k]) + (at.partial[x.k] ? '<sup>½</sup>' : '') + '</div></div>';
    }).join('') + '</div>';

    // Defensas
    if(a && c){
      var hp = (a.pg || 0) + (c.pg + m.con) * ficha.nivel;
      var per = st('per','sab'), fo = st('fort','con',0,res), re = st('ref','des',0,res), vo = st('vol','sab',0,res), cd = st('cd',null,10);
      html += '<div class="ps-row">' +
        box('PG máx.', hp, '&nbsp;actuales: ______') +
        box('CA', ai.ac + (sh ? ' <small>(' + (ai.ac + sh.ca) + ')</small>' : ''), E(ai.armor ? ai.armor.nombre : 'Sin armadura') + (sh ? ' · ' + E(sh.nombre) : '')) +
        box('Percepción', fmtMod(per.v), PROF_LABEL[per.r]) +
        box('Fortaleza', fmtMod(fo.v), PROF_LABEL[fo.r]) +
        box('Reflejos', fmtMod(re.v), PROF_LABEL[re.r]) +
        box('Voluntad', fmtMod(vo.v), PROF_LABEL[vo.r]) +
        box('CD de clase', cd.v, PROF_LABEL[cd.r]) +
        box('Velocidad', (a.velocidad + ai.speedPen), 'pies') + '</div>';
    }

    // Columnas
    var left = '', right = '';

    // Habilidades
    if(c && t){
      var sk = computeSkills();
      var names = SKILLS.map(function(s){ return s.n; }).concat(Object.keys(sk.ranks).filter(isLore).sort());
      left += sec('Habilidades', '<table class="ps-tbl">' + names.map(function(n){
        var r = sk.ranks[n] || 0;
        var v = m[skillAttr(n)] + profBonus(r) + skillArmorPenalty(n, ai);
        return '<tr' + (r ? ' class="tr"' : '') + '><td>' + E(n) + ' <small>' + ATR_NAME[skillAttr(n)].slice(0,3).toUpperCase() + '</small></td><td>' + ['—','E','X','M','L'][r] + '</td><td class="num">' + fmtMod(v) + '</td></tr>';
      }).join('') + '</table><div class="ps-note">E entrenado · X experto · M maestro · L legendario</div>');
    }

    // Ataques
    var armas = (eq.armas || []).map(function(slot){
      var w = findBy(eqData().armas, 'id', slot.id); if(!w) return '';
      var k = weaponCalc(w, slot, m);
      var nm = w.nombre + (slot.potencia ? ' +' + slot.potencia : '') + (slot.golpe ? ' ' + ['','de golpe','de golpe mayor','de golpe superior'][slot.golpe] : '');
      return '<tr><td>' + E(nm) + '<br><small>' + E([w.tipo === 'distancia' ? 'Distancia' + (w.alcance ? ' ' + w.alcance + ' p' : '') : 'C. a c.'].concat(w.rasgos).join(', ')) + '</small></td>' +
             '<td class="num">' + fmtMod(k.atk) + '<br><small>' + fmtMod(k.atk - k.map[0]) + '/' + fmtMod(k.atk - k.map[1]) + '</small></td><td>' + E(k.dmg) + ' ' + E(w.tipoDano || '') + '</td></tr>';
    }).join('');
    if(armas) right += sec('Ataques', '<table class="ps-tbl"><tr><th>Arma</th><th>Ataque</th><th>Daño</th></tr>' + armas + '</table>');

    // Dotes y rasgos
    if(c){
      var TIPOS = {ascendencia:'Ascendencia', clase:'Clase', habilidad:'Habilidad', general:'General'};
      var rows = featSlots().map(function(s){
        var d = ficha.dotes[slotKey(s)];
        return '<tr><td class="num">' + s.nivel + '</td><td>' + TIPOS[s.tipo] + '</td><td>' + (d ? E(d.nombre) : '<span class="ps-empty">—</span>') + '</td></tr>';
      }).join('');
      var granted = activeGrants().filter(function(x){ return x.g.tipo === 'dote'; }).map(function(x){
        return '<tr><td class="num">' + (x.g.nivel || 1) + '</td><td>Concedida</td><td>' + E(x.item ? x.item.name : x.g.nombre) + ' <small>(' + E(x.origen) + ')</small></td></tr>';
      }).join('');
      right += sec('Dotes', '<table class="ps-tbl">' + granted + rows + '</table>');
      var rasgos = c.rasgos.filter(function(r){ return r.nivel <= ficha.nivel; }).map(function(r){ return E(r.nombre) + ' <small>(' + r.nivel + ')</small>'; });
      if(h) rasgos.unshift('Herencia: ' + E(h.nombre));
      right += sec('Rasgos de clase', '<div class="ps-list">' + rasgos.join(' · ') + '</div>');
    }

    // Conjuros
    var ci = casterInfo();
    if(ci && ci.trad){
      var mk = markedSpellsByRank(ci);
      var sa = st('conj', castAttr(c));
      var sp = '<div class="ps-note">' + E(ci.trad) + ' · ' + (ci.espontaneo ? 'espontáneo' : (ci.tipo === 'mixto' ? 'preparado y espontáneo' : 'preparado')) +
               ' · ataque ' + fmtMod(sa.v) + ' · CD ' + (10 + sa.v) + '</div><table class="ps-tbl"><tr><th>Rango</th><th>Esp.</th><th>' + (ci.espontaneo ? 'Repertorio' : 'Preparados') + '</th></tr>' +
               ci.ranks.map(function(r){
                 return '<tr><td>' + (r === 0 ? 'Trucos' : r + '.º') + '</td><td class="num">' + E(String(ci.slots[r])) + '</td><td>' +
                        ((mk.by[r] || []).map(function(s){ return E(s.name); }).join(', ') || '<span class="ps-empty">—</span>') + '</td></tr>';
               }).join('') + '</table>';
      left += sec('Conjuros', sp);
    }
    var fi = focusInfo();
    if(fi.spells.length || fi.cantrips.length){
      var fc = focusCasting(fi);
      left += sec('Conjuros de foco', '<div class="ps-note">Puntos de foco: ' + fi.puntos + ' ' + Array(fi.puntos + 1).join('☐') + ' · rango ' + fi.rango + '.º' +
        (fc ? ' · ataque ' + fmtMod(fc.atk) + ' · CD ' + fc.cd : '') + '</div><div class="ps-list">' +
        fi.spells.concat(fi.cantrips).map(function(s){ return E(s.name) + (isFocusCantrip(s) ? ' <small>(truco)</small>' : ''); }).join(' · ') + '</div>');
    }

    // Equipo
    var eqTxt = [];
    if(ai.armor) eqTxt.push(E(ai.armor.nombre) + (ai.pot ? ' +' + ai.pot : '') + (res ? ' (resistente ' + res + ')' : '') + ' — CA +' + ai.armor.ca + (ai.armor.destrezaMax !== null ? ', Des máx. +' + ai.armor.destrezaMax : '') + (ai.checkPen ? ', penalizador ' + ai.checkPen : ''));
    if(sh) eqTxt.push(E(sh.nombre) + ' — CA +' + sh.ca + ', dureza ' + sh.dureza + ', PG ' + sh.pg);
    right += sec('Equipo', '<div class="ps-list">' + (eqTxt.join('<br>') || '—') + '</div><div class="ps-lines"></div>');
    right += sec('Notas', '<div class="ps-lines tall"></div>');

    html += '<div class="ps-cols"><div>' + left + '</div><div>' + right + '</div></div>';
    html += '<footer class="ps-foot">Grimorio · Pathfinder 2.ª ed. · ' + new Date().toLocaleDateString('es-ES') + '</footer>';
    return html;
  }

  // ---- Exportar / importar la ficha ----
  function exportFicha(name){
    var f = loadJSON(charStorageKeyFicha(name), null);
    if(!f) return null;
    f = JSON.parse(JSON.stringify(f));
    Object.keys(f.dotes || {}).forEach(function(k){
      var d = f.dotes[k]; if(!d) return;
      var ft = FEATS.filter(function(x){ return x.id === d.id; })[0];
      if(ft) f.dotes[k] = {id: ft.id, nombre: ft.name, nivel: ft.level, categoria: ft.category};
    });
    return f;
  }
  function importFicha(f){
    var missing = [];
    if(!f || typeof f !== 'object') return {ficha: null, missing: missing};
    var out = JSON.parse(JSON.stringify(f));
    Object.keys(out.dotes || {}).forEach(function(k){
      var d = out.dotes[k]; if(!d) return;
      var r = importChosenFeats([{id: d.id, nombre: d.nombre, nivel: d.nivel, categoria: d.categoria}]);
      var ids = Object.keys(r.chosen);
      if(ids.length){
        var ft = FEATS.filter(function(x){ return String(x.id) === ids[0]; })[0];
        out.dotes[k] = {id: ft.id, nombre: ft.name};
      } else { missing.push(d.nombre || ('id ' + d.id)); delete out.dotes[k]; }
    });
    return {ficha: out, missing: missing};
  }

  document.getElementById('charImportFile').addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];

    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try{ data = JSON.parse(reader.result); }catch(err){
        alert('El archivo no es un JSON válido.');
        return;
      }
      if(!data || data.formato !== EXPORT_FORMAT || typeof data.nombre !== 'string'){
        alert('Este archivo no es un personaje exportado desde el grimorio.');
        return;
      }
      var name = data.nombre.trim() || 'Personaje importado';
      if(characters.indexOf(name) !== -1){
        if(!confirm('Ya existe un personaje llamado "' + name + '". ¿Quieres sobrescribirlo?\n\nPulsa Cancelar para importarlo con otro nombre.')){
          var base = name, n = 2;
          while(characters.indexOf(base + ' (' + n + ')') !== -1) n++;
          name = base + ' (' + n + ')';
        }
      }
      var prep = (data.preparados && typeof data.preparados === 'object') ? data.preparados : {};
      var kn = (data.aprendidos && typeof data.aprendidos === 'object') ? data.aprendidos : {};
      saveJSON(charStorageKey(name), prep);
      saveJSON(charStorageKeyKnown(name), kn);
      var ftResult = importChosenFeats(data.dotes);

  // Las dotes se exportan con nombre, nivel y categoría además del id,
  // para poder encontrarlas aunque cambie la numeración de feats.json.
  function exportChosenFeats(sel){
    return Object.keys(sel).filter(function(k){ return sel[k]; }).map(function(id){
      var ft = FEATS.filter(function(f){ return String(f.id) === String(id); })[0];
      return ft ? {id: ft.id, nombre: ft.name, nivel: ft.level, categoria: ft.category, grupo: ft.group}
                : {id: isNaN(+id) ? id : +id};
    });
  }
  function importChosenFeats(list){
    var chosen = {}, missing = [];
    if(!Array.isArray(list)) return {chosen: chosen, missing: missing};
    list.forEach(function(d){
      if(!d) return;
      var ft = FEATS.filter(function(f){ return String(f.id) === String(d.id) && (!d.nombre || f.name === d.nombre); })[0];
      if(!ft && d.nombre){
        var cands = FEATS.filter(function(f){ return f.name === d.nombre; });
        ft = cands.filter(function(f){ return f.category === d.categoria && f.level === d.nivel; })[0]
          || cands.filter(function(f){ return f.category === d.categoria; })[0]
          || cands[0];
      }
      if(ft) chosen[ft.id] = true;
      else missing.push(d.nombre || ('id ' + d.id));
    });
    return {chosen: chosen, missing: missing};
  }

  function featMatchesGroup(ft, grp){
    var isArchetype = ft.traits && ft.traits.some(function(t){
      var s = String(t).toLowerCase();
      return s === 'archetype' || s === 'arquetipo';
    });
    if(grp === 'archetype') return ft.group === 'class' && isArchetype;
    if(grp === 'class') return ft.group === 'class' && !isArchetype;
    return ft.group === grp;

  function buildRitualDetailHtml(sp){
    var fullText = sp.fulldesc || sp.desc;
    var html = '';
    var traits = (sp.traits || []).slice();
    var rankLabel = 'Ritual ' + sp.rank;

      return '<span class="trait-pill">'+escapeHtml(t)+'</span>';
    }).join('') + '</div>';

    var stats = '';
    stats += '<dt>Lanzamiento</dt><dd>'+escapeHtml(sp.cast || '')+'</dd>';
    stats += '<dt>Comprobación principal</dt><dd>'+escapeHtml(sp.primaryCheck || '')+'</dd>';
    if(sp.secondaryCasters) stats += '<dt>Lanzadores secundarios</dt><dd>'+escapeHtml(String(sp.secondaryCasters))+(sp.secondaryChecks ? ' — '+escapeHtml(sp.secondaryChecks) : '')+'</dd>';
    if(sp.cost) stats += '<dt>Coste</dt><dd>'+escapeHtml(sp.cost)+'</dd>';
    if(sp.range) stats += '<dt>Rango</dt><dd>'+escapeHtml(sp.range)+'</dd>';
    if(sp.area) stats += '<dt>Área</dt><dd>'+escapeHtml(sp.area)+'</dd>';
    if(sp.target) stats += '<dt>Objetivo</dt><dd>'+escapeHtml(sp.target)+'</dd>';
    if(sp.duration) stats += '<dt>Duración</dt><dd>'+escapeHtml(sp.duration)+'</dd>';
    if(stats) html += '<dl class="detail-stats">'+stats+'</dl>';

    html += '<div class="detail-desc">'+formatResultText(fullText)+'</div>';

    if(sp.heightened){
      html += '<div class="detail-heightened"><span class="label">Potenciado</span>'+formatResultText(sp.heightened)+'</div>';
    }
    return html;
  }

        else if(sp.source && sp.source !== 'Starfinder') sourceHtml = '<span class="source-badge ap" title="'+sp.source+'">AP</span>';

        li.innerHTML =
          '<span class="chk-wrap"><span class="chk" data-role="chk" title="Preparado"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span><span class="chk-known" data-role="chkKnown" title="Aprendido"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span></span>' +
          '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>' +
          '<span class="spell-text"><span class="name">'+escapeHtml(sp.name)+'</span>'+sourceHtml+rarityHtml+'<span class="desc">'+escapeHtml(sp.desc)+'</span></span>';

        var chk = li.querySelector('[data-role="chk"]');
        chk.addEventListener('click', function(e){
          e.stopPropagation();
          toggleSpell(sp.id);
          li.classList.toggle('prepared', !!prepared[sp.id]);
        });
        var chkKnown = li.querySelector('[data-role="chkKnown"]');
        chkKnown.addEventListener('click', function(e){
          e.stopPropagation();
          toggleKnownSpell(sp.id);
          li.classList.toggle('known', !!known[sp.id]);
        });

        li.addEventListener('click', function(){
          expanded[sp.id] = !expanded[sp.id];
          render();
        });

        ul.appendChild(li);

        if(expanded[sp.id]){
          var detail = document.createElement('div');
          detail.className = 'spell-detail';
          detail.innerHTML = buildDetailHtml(sp);
          ul.appendChild(detail);
        }
      });

      section.appendChild(ul);
      main.appendChild(section);
    }

    if(!anyResult){
      var empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = query
        ? 'Ningún conjuro de esta escuela coincide con “'+query+'”.'
        : (showOnlyKnown ? 'No tienes conjuros aprendidos en esta escuela todavía.' : 'No tienes conjuros preparados en esta escuela todavía.');
      main.appendChild(empty);
    }
  }

  var RANK_LABEL = {0:"Truco", 1:"Conjuro 1", 2:"Conjuro 2", 3:"Conjuro 3", 4:"Conjuro 4", 5:"Conjuro 5", 6:"Conjuro 6", 7:"Conjuro 7", 8:"Conjuro 8", 9:"Conjuro 9", 10:"Conjuro 10"};

  function buildDetailHtml(sp){
    var fullText = sp.fulldesc || sp.desc;
    if(!fullText){
      return '<p class="detail-note">No hay descripción completa disponible para este conjuro en el documento original.</p>';
    }
    var html = '';
    var traits = (sp.traits || []).slice();
    if(sp.rankLabel){
      if(!traits.some(function(t){ return t.toLowerCase() === sp.rankLabel.toLowerCase(); })) traits.push(sp.rankLabel);
    } else {
      var rankLabel = RANK_LABEL[sp.rank] || '';
      if(traits.some(function(t){ return t.toLowerCase() === rankLabel.toLowerCase(); })) rankLabel = '';
      traits.push(rankLabel);
    }
    html += '<div class="detail-traits">' + traits.filter(Boolean).map(function(t){
      return '<span class="trait-pill">'+escapeHtml(t)+'</span>';
    }).join('') + '</div>';

    var stats = '';
    var castText = sp.cast || '2 acciones, somático, verbal';
    stats += '<dt>Lanzamiento</dt><dd>'+escapeHtml(castText)+'</dd>';
    if(sp.cast2) stats += '<dt></dt><dd>'+escapeHtml(sp.cast2)+'</dd>';
    if(sp.range) stats += '<dt>Rango</dt><dd>'+escapeHtml(sp.range)+'</dd>';
    if(sp.defense) stats += '<dt>Defensa</dt><dd>'+escapeHtml(sp.defense)+'</dd>';
    if(sp.duration) stats += '<dt>Duración</dt><dd>'+escapeHtml(sp.duration)+'</dd>';
    if(stats) html += '<dl class="detail-stats">'+stats+'</dl>';

    html += '<div class="detail-desc">'+formatResultText(fullText)+'</div>';

    if(sp.heightened){
      html += '<div class="detail-heightened"><span class="label">Potenciado</span>'+formatResultText(sp.heightened)+'</div>';
    }
    return html;
  }

  function formatResultText(text){
    if(!text) return '';
    var lines = text.split('\n');
    return lines.map(function(line){
      // Convierte cualquier **texto** en <b>texto</b> (Requisitos, Desencadenante, Coste, etc.)
      if(line.indexOf('**') !== -1){
        var parts = line.split('**');
        var html = '';
        for(var i=0; i<parts.length; i++){
          html += (i % 2 === 1) ? '<b>'+escapeHtml(parts[i])+'</b>' : escapeHtml(parts[i]);
        }
        return html;
      }
      var m = line.match(/^(Éxito crítico|Fallo crítico|Éxito|Fallo)\b/);
      if(m){
        var label = m[1];
        var rest = line.slice(label.length);
        return '<b>'+escapeHtml(label)+'</b>'+escapeHtml(rest);
      }
      return escapeHtml(line);
    }).join('\n');
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  document.getElementById('main').innerHTML = '<p style="text-align:center;padding:40px;opacity:.7;">Cargando conjuros…</p>';

  Promise.all([
    fetch('spells.json').then(function(r){ return r.json(); }),
    fetch('focus.json').then(function(r){ return r.json(); }),
    fetch('rituals.json').then(function(r){ return r.json(); }),
    fetch('feats.json').then(function(r){ return r.json(); }),
    fetch('base.json').then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
  ]).then(function(results){
    BASE = results[4];
    SPELLS = results[0];
    FOCUS_DATA = results[1];
    FOCUS_SPELLS = FOCUS_DATA.spells || [];
    CLASSES = FOCUS_DATA.classes || [];
    RITUALS = results[2];
    FEATS = results[3];
    migrateFeatsFromPrepared();
    syncGrants();
    renderClassNav();
    renderFeatSkillNav();
    updatePrepCount();
    updateKnownCount();
    render();
  }).catch(function(err){
    document.getElementById('main').innerHTML = '<p style="text-align:center;padding:40px;color:#b33;">No se pudieron cargar los datos de conjuros (spells.json / focus.json). Comprueba que están en la misma carpeta que index.html y que la app se sirve por http(s), no abierta directamente como archivo.</p>';
    console.error('Error cargando datos:', err);
  });

  // ---- Auto-ocultar cabecera al bajar (solo en pantallas estrechas) ----
  (function(){
    var headerEl = document.querySelector('header.top');
    var lastY = window.scrollY;
    var isMobile = function(){ return window.matchMedia('(max-width: 640px)').matches; };
    var ticking = false;
    window.addEventListener('scroll', function(){
      if(!isMobile()){ headerEl.classList.remove('header-hidden'); lastY = window.scrollY; return; }
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(function(){
        var y = window.scrollY;
        var goingDown = y > lastY;
        if(y < 40){
          headerEl.classList.remove('header-hidden');
        } else if(goingDown && (y - lastY) > 4){
          headerEl.classList.add('header-hidden');
        } else if(!goingDown && (lastY - y) > 4){
          headerEl.classList.remove('header-hidden');
        }
        lastY = y;
        ticking = false;
      });
    }, {passive:true});
  })();
})();
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('No se pudo registrar el service worker:', err);
      });
    });
  }
</script>
<div id="printSheet"></div>
